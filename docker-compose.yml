services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=mysql://lagernaut:lagernaut@db:3306/lagernaut
      - REDIS_URL=redis://redis:6379
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=9852af2e1d13039762b1bca3c51c55302c6c5a5fb36ea66c7987b66bd80f6ba2
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DB_EXPLORER_PASSWORD=kräutertee
      - NEXTAUTH_URL=http://49.13.162.158:3000
      - DB_EXPLORER_PASSWORD=kräutertee
      - REFORM_DIR=/data/reform
      # Google Custom Search fuer das automatische Nachschlagen von
      # Teilenummern. Ohne diese beiden Werte laeuft alles wie bisher, nur der
      # Knopf "Automatisch nachschlagen" erscheint nicht.
      # WICHTIG: Im Google-Konto KEIN Zahlungskonto hinterlegen. Dann sind die
      # 100 Abfragen pro Tag gratis und Google antwortet danach mit einem
      # Fehler statt mit einer Rechnung.
      # Nur noch Rueckfall; leer, seit Google die Schnittstelle fuer neue
      # Kunden geschlossen hat. Die :- sorgen dafuer, dass compose nicht bei
      # jedem Deploy warnt.
      - GOOGLE_CSE_KEY=${GOOGLE_CSE_KEY:-}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID:-}
      # Eigene Metasuche im Docker-Netz. Ist sie gesetzt, hat sie Vorrang vor
      # Google — sie sucht im ganzen Web statt nur in gelisteten Domains.
      - SEARXNG_URL=http://searxng:8080
      # Bilderkennung ueber den Gratis-Zugang von aistudio.google.com.
      # Fehlt der Schluessel, verschwindet der Foto-Einstieg im Assistenten;
      # alles andere laeuft unveraendert weiter.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODELL=${GEMINI_MODELL:-gemini-3.6-flash}
    volumes:
      # Gemeinsamer Ordner mit dem ReForm-Sync (Trigger + Status). Der Host-Wächter
      # liest den Trigger; die App schreibt Trigger/Status. Bind-Mount vom Host.
      - /var/www/lagernaut/reform:/data/reform
    depends_on:
      - db
      - redis
      - meilisearch
    restart: unless-stopped

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lagernaut
      MYSQL_USER: lagernaut
      MYSQL_PASSWORD: lagernaut
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # ── Eigene Metasuche ──────────────────────────────────────────────────────
  # Holt Fundstellen zu Teilenummern. Bewusst OHNE Portfreigabe nach aussen:
  # nur die App im selben Docker-Netz darf zugreifen. Eine offene Instanz waere
  # eine Einladung fuer fremden Suchverkehr ueber eure Leitung.
  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: 9852af2e1d13039762b1bca3c51c55302c6c5a5fb36ea66c7987b66bd80f6ba2
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
